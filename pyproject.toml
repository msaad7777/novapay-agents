[project]
name = "novapay-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "59375560+msaad7777@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

