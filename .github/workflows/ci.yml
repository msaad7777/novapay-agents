name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen  # no extras: the AWS Emulator test is skipped
      - run: uv run pytest -q
      - run: uv run python -m novapay_agents.generate
      - run: uv run python eval/run.py  # fails if any labelled proposal is decided wrongly
